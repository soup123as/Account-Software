<head>
<meta charset="utf-8">
<title>The Fire Knight — Bus Owners × The Sentinel</title>
<!--
  STYLE BRIEF
  Theme / feeling   : bus fleet fire safety — calm, watchful, premium
  Concept           : one continuous shot (candidates: problem -> gone, macro product). The bus is the map.
  Fingerprint       : continuous shot · 1 world · bus (cabin, cylinder, engine, battery, Sentinel) ·
                      opens already close on the lit cabin · closes on a pull-back under the logo
  Palette (brand)   : black #000 / #080808, text #fff + #fafafa, accent gold #f0b242 (thefireknight.in brief).
                      Objects keep real colours; red only on the extinguisher and the fire zone.
  Fonts (brand)     : DM Sans (sentences) + Anton (caps hits) — the client's fixed brand system.
  Background        : cinematic dark; night highway that keeps flowing, sodium glow, living grain (>= 2 layers)
  Signature motion  : one gold line that draws itself and travels (distance -> hose)
  Special moment    : the camera passes through the bus wall; the body turns x-ray as it crosses
  Deterministic     : everything is a pure function of tl.time(); no clocks, no Math.random in render
-->
<script src="lib/gsap.min.js"></script>
<style>

#ui button{background:#262A34;color:#fff;border:none;padding:7px 14px;border-radius:8px;font:inherit;cursor:pointer}
#scrub{width:300px;accent-color:var(--gold)}
#clock{font-variant-numeric:tabular-nums;min-width:5.6ch;text-align:right}
</style>

<script>
/* ============ UTIL ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const NS='http://www.w3.org/2000/svg', W=1080, H=1920;
const el=(n,a={},p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const rnd=s=>{const x=Math.sin(s*127.1+311.7)*43758.5453;return x-Math.floor(x);};        // seed-time only
const noise=(t,s=0)=>{const i=Math.floor(t),f=t-i,a=rnd(i+s*101)*2-1,b=rnd(i+1+s*101)*2-1,u=f*f*(3-2*f);return a+(b-a)*u;};
const defs=$('#filters defs');let fc=0;
function makeBlur(){const id='mb'+(fc++);const f=el('filter',{id,x:'-70%',y:'-70%',width:'240%',height:'240%'},defs);
  const g=el('feGaussianBlur',{stdDeviation:'0 0'},f);return{url:`url(#${id})`,node:g};}
function blurTween(tl,targets,at,from,to,dur,{ease='power3.out',ax=1,ay=.08}={}){const b=makeBlur(),o={v:from};
  tl.set(targets,{filter:b.url},at);
  tl.to(o,{v:to,duration:dur,ease,onUpdate(){b.node.setAttribute('stdDeviation',`${(o.v*ax).toFixed(2)} ${(o.v*ay).toFixed(2)}`);}},at);
  tl.set(targets,{filter:'none'},at+dur);}
function splitChars(e){const words=(e.textContent||'').split(' ');e.textContent='';const out=[];
  words.forEach((w,i)=>{const wr=document.createElement('span');wr.className='wd';
    for(const c of w){const s=document.createElement('span');s.className='ch';s.textContent=c;wr.appendChild(s);out.push(s);}
    e.appendChild(wr);if(i<words.length-1){const sp=document.createElement('span');sp.className='ch';sp.innerHTML='&nbsp;';e.appendChild(sp);out.push(sp);}});return out;}

/* ============ WORLD DRESSING (seeded once at load) ============ */
{const g=$('#town');for(let i=0;i<120;i++)el('circle',{cx:-4800+i*88+rnd(i)*60,cy:262-20-rnd(i+3)*70,r:1.4+rnd(i+5)*1.8,fill:rnd(i+7)>.5?'#FFBE6A':'#d8e6f0',opacity:.22+rnd(i+9)*.35},g);}
{const g=$('#poles');for(let i=0;i<9;i++){const x=-3000+i*900;el('rect',{x,y:-138,width:6,height:520,fill:'#15181b'},g);
  el('path',{d:`M${x+3} -138 q4 -20 46 -18`,stroke:'#15181b','stroke-width':5,fill:'none'},g);el('rect',{x:x+38,y:-160,width:26,height:8,rx:3,fill:'#2a2e33'},g);
  el('circle',{cx:x+50,cy:-152,r:130,fill:'url(#wPole)'},g);el('ellipse',{cx:x+60,cy:412,rx:260,ry:30,fill:'#FFBE6A',opacity:.08},g);}}
{const g=$('#dashes');for(let i=0;i<50;i++)el('rect',{x:-5000+i*220,y:502,width:110,height:8,fill:'#d9d9d9',opacity:.4},g);}
const MODS=[[1096,220],[368,236],[430,66],[760,66]];
{const g=$('#mods');MODS.forEach(([x,y])=>{const m=el('g',{class:'mod h0'},g);m.dataset.o=`${x}px ${y}px`;
  el('rect',{x:x-11,y:y-6,width:22,height:14,rx:6,fill:'#cfd5da'},m);el('circle',{cx:x,cy:y+1,r:3.6,fill:'#0b0b0b'},m);el('circle',{cx:x+6,cy:y+5,r:1.4,fill:'#e8e8e8'},m);});
 const c=$('#cones');MODS.forEach(([x,y])=>el('polygon',{class:'cone h0',points:`${x-6},${y+8} ${x+6},${y+8} ${x+70},${y+110} ${x-70},${y+110}`,fill:'#e9f3fa'},c));}
const FL=[1,.82,.58,.32].map((k,i)=>el('path',{fill:['#E2361A','#FF6A1A','#FFB33A','#FFF4DC'][i],opacity:[.85,.95,1,1][i]},$('#flame')));
const SP=[...Array(9)].map((_,i)=>el('circle',{r:1.6,fill:'#ffd27a'},$('#sparks')));
const MI=[...Array(120)].map((_,i)=>el('circle',{fill:'#E9F3FA'},$('#mist')));
const SG=[0,1,2].map(i=>el('path',{},$('#sig')));

/* ============ CAPTIONS (HUD) ============ */
const caps=$('#caps');
function cap(small,big,{n,m}={}){const c=document.createElement('div');c.className='cap';
  if(n){const e=document.createElement('div');e.className='n';e.textContent=n;c.appendChild(e);}
  const lines=[].concat(small||[]).map(t=>{const e=document.createElement('div');e.className='s';e.textContent=t;c.appendChild(e);return{e,ch:null};});
  let b=null;if(big){b=document.createElement('div');b.className='b'+(m?' m':'');
    big.split(' ').forEach(w=>{const gold=w.startsWith('*');const o=document.createElement('span');o.className='bw';const i=document.createElement('span');
      i.textContent=gold?w.slice(1):w;if(gold)i.className='g';o.appendChild(i);b.appendChild(o);});c.appendChild(b);}
  caps.appendChild(c);if(b)gsap.set(b.querySelectorAll('.bw>span'),{yPercent:110});return{c,lines,b,n:c.querySelector('.n')};}

/* ============ STATE + CAMERA ============ */
const S={flow:0,xray:0,door:0,fire:0,mist:0,spark:0,sig:0,haz:0,bob:1};
const CAM={s:2.6,fx:430,fy:130,ay:1200};
const world=$('#world'),L0=$('#L0'),L1=$('#L1'),L2=$('#L2'),WH=$$('.whl'),grain=$('#grain'),bob=$('#busbob');
function render(t){
  /* camera: world point (fx,fy) lands on screen (540, ay); a slow breath rides on top */
  const s=CAM.s*(1+.008*Math.sin(t*.7));
  world.style.transform=`translate(${(540-CAM.fx*s).toFixed(2)}px,${(CAM.ay-CAM.fy*s).toFixed(2)}px) scale(${s.toFixed(4)})`;
  /* the road flows as a DISTANCE (S.flow), never as accumulated speed */
  $('#dashes').setAttribute('transform',`translate(${-(S.flow%220)} 0)`);
  $('#poles').setAttribute('transform',`translate(${-((S.flow*.6)%900)} 0)`);
  $('#town').setAttribute('transform',`translate(${-((S.flow*.06)%1056)} 0)`);
  const wa=`rotate(${(S.flow*.64)%360})`;for(const w of WH)w.setAttribute('transform',wa);
  bob.setAttribute('transform',`translate(0 ${(Math.sin(t*9)*.5*S.bob).toFixed(2)})`);
  L1.style.opacity=(1-S.xray)*(1-S.door);L2.style.opacity=(1-S.xray)*S.door;
  /* fire in the engine bay */
  const h=S.fire*72;
  FL.forEach((p,i)=>{const k=[1,.82,.58,.32][i],hh=h*k*(.85+.25*noise(t*10+i*3,i)),ww=h*.45*k,lean=noise(t*7+i,i+4)*ww*.5,x=1080,y=318;
    p.setAttribute('d',h<1?'':`M${x-ww} ${y} C${x-ww} ${y-hh*.45} ${x-ww*.2+lean} ${y-hh*.6} ${x+lean} ${y-hh} C${x+ww*.25+lean} ${y-hh*.6} ${x+ww} ${y-hh*.42} ${x+ww} ${y}Z`);});
  /* sparks at the battery terminal */
  SP.forEach((c,i)=>{const a=(t*1.6+rnd(i))%1;c.setAttribute('cx',370+(rnd(i+3)-.5)*30+a*(rnd(i+5)-.5)*60);c.setAttribute('cy',246-a*54);c.setAttribute('opacity',S.spark*(1-a));});
  /* suppression: only under the engine module */
  MI.forEach((c,i)=>{const sp=.6+rnd(i)*.6,a=(t*1.05*sp+rnd(i+1))%1,d=(rnd(i+2)-.5)*2;
    c.setAttribute('cx',1096+d*80*a);c.setAttribute('cy',228+a*94*Math.min(1,S.mist*1.3));c.setAttribute('r',1.1+rnd(i+3)*1.7);c.setAttribute('opacity',.6*(1-a*.6)*Math.min(1,S.mist*1.5));});
  /* the alert travelling up from the roof */
  SG.forEach((p,i)=>{const a=(t*.9+i/3)%1,r=20+a*90;p.setAttribute('d',`M${300-r} ${30-r*.55} A${r} ${r} 0 0 1 ${300+r} ${30-r*.55}`);p.setAttribute('opacity',S.sig*(1-a));});
  $('#mcone').setAttribute('opacity',.3*S.mist);
  $('#hazard').style.opacity=S.haz*(Math.sin(t*5.2)>0?1:.08);
  $('#hz1').setAttribute('cx',420+Math.sin(t*.5)*40);$('#hz2').setAttribute('cx',640+Math.sin(t*.4+1)*50);$('#hz3').setAttribute('cx',840+Math.sin(t*.45+2)*36);
  const tip=$('#gold'),L=tip.getTotalLength(),o=parseFloat(tip.style.strokeDashoffset||L),pt=tip.getPointAtLength(Math.max(0,L-o));
  $('#goldtip').setAttribute('cx',pt.x);$('#goldtip').setAttribute('cy',pt.y);
  const k=Math.floor(t*12);grain.style.transform=`translate(${k*37%60-30}px,${k*61%60-30}px)`;
}

/* ============ TIMELINE — the only place time is written (absolute seconds) ============ */
const Q=new URLSearchParams(location.search);
const DURATION=37;
const tl=gsap.timeline({paused:true});
const IR={immediateRender:false};
const shot=(at,dur,s,fx,fy,ease='power2.inOut',ay)=>tl.to(CAM,Object.assign({s,fx,fy,duration:dur,ease},ay?{ay}:{}),at);
const show=(q,at,d=.4,o=1)=>tl.fromTo(q,{opacity:0},{opacity:o,duration:d,ease:'power2.out',...IR},at);
const hide=(q,at,d=.35)=>tl.to(q,{opacity:0,duration:d,ease:'power2.in'},at);

/* caption doors: the small line types on with directional blur, the Anton line rises from a mask.
   Entry direction alternates so no two neighbours arrive the same way. */
let door=0;
function say(c,at,out,{bigAt}={}){const dir=[[-1,0],[0,1],[1,0],[0,-1]][door++%4];
  tl.set(c.c,{visibility:'visible'},at);
  if(c.n)tl.fromTo(c.n,{opacity:0,x:-20},{opacity:1,x:0,duration:.3,ease:'power3.out',...IR},at);
  let t=at;
  c.lines.forEach(l=>{l.ch=l.ch||splitChars(l.e);
    tl.fromTo(l.ch,{opacity:0,xPercent:dir[0]*55,yPercent:dir[1]*70},{opacity:1,xPercent:0,yPercent:0,duration:.5,ease:'power4.out',stagger:.016,...IR},t);
    blurTween(tl,l.e,t,dir[0]?34:22,0,.55,dir[0]?{}:{ax:.1,ay:1});t+=.42;});
  if(c.b){const w=$$('.bw>span',c.b),bt=bigAt??(at+(c.n?.06:.38));
    tl.fromTo(w,{yPercent:110},{yPercent:0,duration:.6,ease:'expo.out',stagger:.07,...IR},bt);blurTween(tl,c.b,bt,18,0,.5,{ax:.1,ay:1});}
  /* exit: lift and blur, faster than the entry */
  tl.to(c.c,{opacity:0,y:-26,duration:.28,ease:'power2.in'},out);blurTween(tl,c.c,out,0,22,.3,{ease:'power2.in',ax:.1,ay:1});
  tl.set(c.c,{visibility:'hidden'},out+.3);}

/* ---- opening state ---- */
const gold=$('#gold'),GL=gold.getTotalLength();gold.style.strokeDasharray=GL;gold.style.strokeDashoffset=GL;
$$('.hose').forEach(p=>{const l=p.getTotalLength();p.style.strokeDasharray=l;p.style.strokeDashoffset=l;});
tl.set(S,{flow:0},0);
tl.to(S,{flow:9300,duration:29.6,ease:'none'},0);                 // cruising
tl.to(S,{flow:9590,duration:1.9,ease:'power2.out'},29.6);         // braking to a stop

/* 0.0-5.0  HOOK — born close on the lit cabin, glide back to the dark engine */
shot(0,2.9,2.6,720,130,'sine.inOut');
shot(2.8,.9,3.0,1094,266,'power2.inOut',1400);
shot(3.7,1.3,3.25,1094,266,'sine.out',1400);
show('#heat',3.4,1.2,.35);
say(cap('Passengers ki safety ka','POORA *KHAYAL'),.05,2.75);
say(cap('par engine aur battery ki','SAFETY KA *KYA?'),3.0,4.95);

/* 5.0-9.2  THROUGH THE WALL — the body turns x-ray, travel forward to the red cylinder */
shot(5.0,.55,4.7,1094,266,'power2.in');

hide('#heat',5.3,.4);
shot(5.55,1.85,3.3,118,170,'power3.inOut',1300);
show('#extglow',7.5,.5);
tl.to('#extglow',{scale:1.25,transformOrigin:'112px 160px',duration:.8,ease:'sine.inOut',yoyo:true,repeat:1},7.9);
shot(7.4,1.8,3.6,118,170,'sine.inOut');
say(cap(['Shayad jawab hai…','driver ki seat ke peeche'],'EK *LAAL CYLINDER',{m:1}),5.9,8.95,{bigAt:7.6});

/* 9.2-15.2  THE GOLD LINE — it leaves the cylinder and the camera rides it to where nobody looks */
shot(9.2,.9,2.5,210,200,'power2.inOut',1250);
show('#gold',9.5,.2);show('#goldtip',9.5,.2);
tl.to(gold,{strokeDashoffset:GL*.9,duration:.7,ease:'power2.in'},9.5);
tl.to(gold,{strokeDashoffset:0,duration:1.25,ease:'power2.inOut'},10.2);
shot(10.2,1.25,3.0,1090,262,'power2.inOut',1400);
hide('#extglow',10.0);
say(cap(['Lekin aag wahan lagti hai,','jahan koi'],'*DEKH NAHI RAHA',{m:1}),9.25,11.35,{bigAt:10.35});
show('#heat',11.3,.5,.8);tl.to(S,{fire:.35,duration:.8,ease:'power2.out'},11.5);
say(cap(null,'ENGINE BAY',{n:'01'}),11.6,12.7);
shot(12.75,.55,4.2,372,266,'power2.inOut',1450);tl.to(S,{spark:1,duration:.3},12.9);
say(cap(null,'BATTERY BOX',{n:'02'}),12.95,13.9);
shot(13.95,.6,2.3,600,140,'power2.inOut',1200);tl.to(S,{spark:0,duration:.4},14.0);show('#haze',14.05,.7,.55);
say(cap(null,'CABIN',{n:'03'}),14.1,15.25);

/* 15.2-20.2  THE SENTINEL — the line becomes the hose; cylinder, hoses and modules assemble in place */
hide('#haze',15.1,.6);tl.to(S,{fire:0,duration:.5},15.1);hide('#heat',15.1,.5);hide('#goldtip',15.2,.3);
shot(15.2,.75,3.0,560,280,'power2.inOut',1400);
tl.fromTo('#cyl',{opacity:0,x:-90},{opacity:1,x:0,duration:.6,ease:'expo.out',...IR},15.45);
tl.fromTo('#insert',{opacity:0,scale:.25,y:230},{opacity:1,scale:1,y:0,duration:.7,ease:'expo.out',...IR},15.8);
show('#link1',16.0,.3);
say(cap('The Fire Knight ka','*SENTINEL'),15.4,17.75);
tl.to('#insert',{opacity:0,scale:.3,y:230,duration:.45,ease:'power3.in'},17.2);hide('#link1',17.15,.25);
shot(16.9,1.1,1.62,610,215,'power2.inOut',1250);
tl.to(gold,{stroke:'#c3c9cf',duration:.4},16.6);tl.to(gold,{opacity:0,duration:.7,ease:'power2.in'},16.9);
tl.to('.hose',{strokeDashoffset:0,opacity:1,duration:.8,ease:'power2.inOut',stagger:.1},16.9);
$$('.mod').forEach((m,i)=>tl.fromTo(m,{opacity:0,scale:.2,transformOrigin:m.dataset.o},{opacity:1,scale:1,duration:.5,ease:'back.out(2.2)',...IR},17.5+i*.12));
tl.fromTo('.cone',{opacity:0},{opacity:.13,duration:.5,stagger:.08,...IR},18.0);
show('#zEng',18.1,.35);show('#zBat',18.22,.35);show('#zCab',18.34,.35);
shot(18.0,2.2,1.7,650,215,'sine.inOut');
say(cap('har zone par','*NAZAR'),18.0,20.1);

/* 20.2-26.0  ONE ZONE ONLY — fire in the engine; that zone turns red and is the only one to discharge */
shot(20.2,.75,2.7,1050,250,'power2.inOut',1380);
show('#heat',20.4,.6,.85);tl.to(S,{fire:.85,duration:1.0,ease:'power2.in'},20.4);
say(cap('Aag jis zone mein'),20.45,21.85);
tl.to('#zEng',{opacity:0,duration:.15},21.5);show('#zEngR',21.5,.15);
tl.to(['#zBat','#zCab'],{opacity:.3,duration:.4},21.5);tl.to('.cone',{opacity:.04,duration:.4},21.5);
tl.to(S,{mist:1,duration:.5,ease:'power2.out'},22.0);
tl.to(S,{fire:0,duration:1.5,ease:'power2.inOut'},22.3);hide('#heat',22.6,1.2);
say(cap('sirf usi zone mein','*DISCHARGE'),22.0,25.75);
shot(23.9,1.3,1.62,690,215,'power2.inOut',1250);
tl.to(S,{mist:0,duration:.8},25.0);

/* 26.0-30.0  BUTTON + ALERT — both lift out of the bus as objects */
tl.to(['#zEngR','#zBat','#zCab','.cone'],{opacity:0,duration:.4},25.7);
shot(26.0,.75,3.0,80,170,'power2.inOut',1300);
tl.fromTo('#btn',{opacity:0,scale:.2,x:-250,y:420},{opacity:1,scale:1,x:0,y:0,duration:.6,ease:'back.out(1.5)',...IR},26.5);
show('#link2',26.8,.3);show('#link2d',26.8,.3);
tl.to('#btncap',{attr:{r:41},duration:.12,ease:'power2.in'},27.35);tl.to('#btncap',{attr:{r:46},duration:.25,ease:'back.out(3)'},27.5);
tl.to('#btnled',{attr:{fill:'#E3281C'},duration:.05},27.4);
say(cap('Driver ke paas','DASHBOARD *BUTTON',{m:1}),26.3,28.0);
tl.to('#btn',{opacity:0,scale:.6,duration:.3,ease:'power2.in'},27.95);hide(['#link2','#link2d'],27.9,.25);
shot(28.0,.7,2.2,300,60,'power2.inOut',1200);
tl.to(S,{sig:1,duration:.3},28.2);
tl.fromTo('#phone',{opacity:0,x:260,rotate:8},{opacity:1,x:0,rotate:0,duration:.6,ease:'expo.out',...IR},28.3);
tl.fromTo('#note',{opacity:0,y:-30,scale:.9},{opacity:1,y:0,scale:1,duration:.4,ease:'back.out(1.8)',...IR},28.75);
say(cap('Aapke phone par','*ALERT'),28.2,29.95);
tl.to('#phone',{opacity:0,x:260,duration:.35,ease:'power2.in'},29.9);tl.to(S,{sig:0,duration:.3},29.8);

/* 30.0-33.4  PASSENGERS FIRST — the body returns, the bus stops, hazards, the door opens */
tl.to(S,{xray:0,duration:.8,ease:'power1.inOut'},30.0);
tl.to(['.hose','#cyl','.mod'],{opacity:0,duration:.6},30.0);
shot(30.0,1.0,2.3,190,225,'power2.inOut',1250);
tl.to(S,{haz:1,duration:.2},30.8);tl.to(S,{bob:0,duration:.6},31.2);
tl.to(S,{door:1,duration:.7,ease:'power2.inOut'},31.4);show('#doorlight',31.6,.6);
shot(31.0,2.4,2.5,170,230,'sine.inOut',1280);
say(cap('Driver ka pehla kaam','*PASSENGERS KO',{m:1}),30.3,32.45);
say(cap('utaarna hai…','CYLINDER DHOONDHNA *NAHI',{m:1}),32.55,33.6,{bigAt:32.7});

/* 33.4-37.0  PULL BACK — the bus settles low in the frame under the logo and the question */
shot(33.4,1.5,.84,600,191,'power3.inOut',1500);
tl.to('#shade',{opacity:.55,duration:1},33.4);
tl.fromTo('#emblem',{opacity:0,y:40,scale:.92},{opacity:1,y:0,scale:1,duration:.6,ease:'power3.out',...IR},34.2);blurTween(tl,'#emblem',34.2,14,0,.6,{ax:.1,ay:1});
tl.fromTo('#wordmark',{opacity:1,clipPath:'inset(0% 100% 0% 0%)'},{clipPath:'inset(0% 0% 0% 0%)',duration:.5,ease:'power3.inOut',...IR},34.6);
tl.fromTo('#prod',{opacity:0,letterSpacing:'.2em'},{opacity:1,letterSpacing:'.05em',duration:.6,ease:'power3.out',...IR},34.9);
tl.fromTo('#q',{opacity:0,y:24},{opacity:1,y:0,duration:.5,ease:'power3.out',...IR},35.3);blurTween(tl,'#q',35.3,16,0,.5,{ax:.1,ay:1});
tl.fromTo('#cta',{opacity:0,y:24},{opacity:1,y:0,duration:.5,ease:'back.out(1.6)',...IR},35.6);
tl.to('#cta',{boxShadow:'0 0 26px rgba(240,178,66,.45)',duration:.6,ease:'sine.inOut',yoyo:true,repeat:1},36.0);
shot(34.9,2.1,.87,600,191,'sine.out',1500);
tl.to({},{duration:.01},DURATION);

/* ============ GLUE ============ */
const stage=$('#stage');
const fit=()=>{const s=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(-50%,-50%) scale(${s})`;};
addEventListener('resize',fit);fit();
const clock=$('#clock'),scrub=$('#scrub'),btnP=$('#btn-play'),snd=$('#snd');let scrubbing=false;
(function frame(){const t=tl.time();render(t);clock.textContent=t.toFixed(2)+'s';if(!scrubbing)scrub.value=String(t/DURATION*1000);requestAnimationFrame(frame);})();
const CLEAN=Q.has('clean');
const syncSnd=()=>{if(CLEAN)return;try{snd.currentTime=tl.time();if(tl.paused())snd.pause();else snd.play().catch(()=>{});}catch(e){}};
const toggle=()=>{if(tl.paused()||tl.progress()>=1){if(tl.progress()>=1)tl.progress(0);tl.play();btnP.textContent='Pause';}else{tl.pause();btnP.textContent='Play';}syncSnd();};
btnP.onclick=toggle;$('#btn-restart').onclick=()=>{tl.pause(0);tl.play();syncSnd();};
scrub.addEventListener('pointerdown',()=>{scrubbing=true;tl.pause();syncSnd();});addEventListener('pointerup',()=>scrubbing=false);
scrub.addEventListener('input',()=>{tl.pause();tl.time(scrub.value/1000*DURATION);});
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle();}if(/^[rR]$/.test(e.key)){tl.pause(0);tl.play();syncSnd();}if(/^[hH]$/.test(e.key))$('#ui').classList.toggle('on');});
if(Q.has('debug'))$('#ui').classList.add('on');
tl.eventCallback('onComplete',()=>{tl.play(0);syncSnd();});          // loop, sound restarts with it
const seek=t=>{tl.pause();tl.time(t,false);if(gsap.ticker.tick)gsap.ticker.tick();render(t);};
window.OPENER={tl,DURATION,seek,W,H,ready:false};
document.fonts.ready.then(()=>{
  $$('.cap .b,.cap .s').forEach(e=>{let fs=parseFloat(getComputedStyle(e).fontSize);while(e.scrollWidth>820&&fs>24){fs-=2;e.style.fontSize=fs+'px';}});
  window.OPENER.ready=true;render(0);
  if(CLEAN)return;
  /* start together with the sound; if autoplay is blocked, hold on frame 0 until the first gesture */
  snd.play().then(()=>{tl.play(0);}).catch(()=>{const go=()=>{removeEventListener('pointerdown',go);removeEventListener('keydown',go);snd.play().catch(()=>{});tl.play(0);};
    addEventListener('pointerdown',go);addEventListener('keydown',go);});
});
</script>
